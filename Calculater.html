<!DOCTYPE html>
<html>
<head>

    <title>My calculator</title>
    <link rel="stylesheet" href="sytle(1).css">
</head>
<body>
    <div id="calculator">
        <div id="display">0</div>
        <div>
            <button class="ac">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="operator">/</button>

        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="back">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>

    </div>
</body>
</html>
